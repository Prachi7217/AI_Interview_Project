```html
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

    <h1 class="text-center">
        AI Interview Preparation System
    </h1>

    <div class="row mt-4">

        <div class="col-md-4">
            <div class="card text-center p-3">
                <h5>Total Interviews</h5>
                <h2>{{ total_interviews }}</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center p-3">
                <h5>Highest Score</h5>
                <h2>{{ highest_score }}</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center p-3">
                <h5>Average Score</h5>
                <h2>{{ average_score }}</h2>
            </div>
        </div>

    </div>

    <div class="card p-4 mt-4">

        <h3>Select Interview Type</h3>

        <a href="/questions/HR" class="btn btn-primary m-2">
            HR Interview
        </a>

        <a href="/questions/Python" class="btn btn-success m-2">
            Python Interview
        </a>

        <a href="/questions/Java" class="btn btn-warning m-2">
            Java Interview
        </a>

        <hr>

        <a href="/history" class="btn btn-dark m-2">
            Interview History
        </a>

        <a href="/logout" class="btn btn-danger m-2">
            Logout
        </a>

    </div>

</body>
</html>
```
